services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: crewlane
      POSTGRES_PASSWORD: crewlane
      POSTGRES_DB: crewlane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewlane"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO pulled minio/minio off Docker Hub on 2026-09-11 (Hub now returns
    # "pull access denied... repository does not exist") - same images/tags
    # are still published to quay.io with no login required.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crewlane
      MINIO_ROOT_PASSWORD: crewlane-secret-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crewlane:crewlane@postgres:5432/crewlane
      FRONTEND_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crewlane
      S3_ACCESS_KEY: crewlane
      S3_SECRET_KEY: crewlane-secret-minio
      JOB_WORKER_ENABLED: "true"
      # EmbeddingGemma-300M + Docling models (D70/D71) - cache to a named
      # volume so the gated, multi-GB first-run download survives container
      # recreates instead of re-pulling every time.
      HF_HOME: /app/data/hf-cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploaddata:/app/data/uploads
      - hfcache:/app/data/hf-cache
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEV_AUTH: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  uploaddata:
  hfcache:
