[project]
name = "crewlane-backend"
version = "0.1.0"
description = "CrewLane backend — FastAPI process: REST, agent/job mount points"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "groq>=1.6.0",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pgvector>=0.3",
    # Sole parser/chunker for every format it supports (D71) - no fallback
    # left, so this is a base dependency, not an optional group like D68
    # originally shipped it.
    "docling>=2.0",
    # Local embedding model (D70) - sentence-transformers>=6.0 for
    # EmbeddingGemma's named query/document prompts. transformers pinned
    # explicitly and tighter than sentence-transformers' own >=4.41 floor:
    # below 4.57, EmbeddingGemma silently runs causal instead of
    # bidirectional attention - no error, no warning, just degraded
    # embeddings (HF sentence-transformers issue #3725, Recall@20
    # 0.669->0.465 in their own benchmark).
    "sentence-transformers>=6.0",
    "transformers>=4.57",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Coverage gate is enforced in CI/dev via: pytest --cov=app --cov-fail-under=80
# Default runs stay fast; use the explicit command for the 80% bar.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["UP007", "UP035", "I001", "E501"]
"alembic/env.py" = ["I001"]
"scripts/*.py" = ["E402"]
